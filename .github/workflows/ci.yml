name: ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.11"
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev
      - name: Pytest
        env:
          REVIEW_AGENT_EXECUTOR_BACKEND: host
        run: uv run --extra dev pytest -q -rs
      - name: No-key smoke run
        run: uv run --extra dev python scripts/fake-model-smoke.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run typecheck
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run build
      - name: Built web assets match the committed copy
        run: git diff --exit-code -- src/review_agent/web
