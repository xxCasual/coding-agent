name: ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.11"
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev
      - name: Pytest
        env:
          REVIEW_AGENT_EXECUTOR_BACKEND: host
        run: uv run --extra dev pytest -q
