# PostgreSQL + Redis + API + worker + beat.
# One-click demo: cp .env.example .env  # set DEEPSEEK_API_KEY
#   docker compose up -d --build
#   bash scripts/compose-smoke.sh
#   open http://127.0.0.1:8000

x-app-build: &app-build
  context: .
  dockerfile: Dockerfile.compose

x-app-env: &app-env
  REVIEW_AGENT_DATABASE_URL: postgresql+psycopg://review_agent:review_agent@postgres:5432/review_agent
  REVIEW_AGENT_DATA_ROOT: /var/lib/review-agent
  REVIEW_AGENT_CELERY_BROKER: redis://redis:6379/0
  PYTHONPATH: /app/src
  # Faster pip in CN; override with PIP_INDEX_URL in .env if needed.
  PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
  PIP_TRUSTED_HOST: pypi.tuna.tsinghua.edu.cn
  # Containers cannot nest docker runs; execute commands in-process.
  REVIEW_AGENT_EXECUTOR_BACKEND: host
  # MCP off by default for segment-1 demo; override via .env for Skill+MCP demos.
  REVIEW_AGENT_MCP_SERVERS: "${REVIEW_AGENT_MCP_SERVERS:-[]}"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: review_agent
      POSTGRES_PASSWORD: review_agent
      POSTGRES_DB: review_agent
    ports:
      - "5432:5432"
    volumes:
      - review_agent_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U review_agent -d review_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: *app-build
    working_dir: /app
    volumes:
      - .:/app
      - review_agent_data:/var/lib/review-agent
      - pip_cache:/root/.cache/pip
    environment:
      <<: *app-env
    env_file:
      - path: .env
        required: false
    command: ["bash", "scripts/compose-api.sh"]
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')\""]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 600s

  worker:
    build: *app-build
    working_dir: /app
    volumes:
      - .:/app
      - review_agent_data:/var/lib/review-agent
      - pip_cache:/root/.cache/pip
    environment:
      <<: *app-env
    env_file:
      - path: .env
        required: false
    command: ["bash", "scripts/compose-worker.sh"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  beat:
    build: *app-build
    working_dir: /app
    volumes:
      - .:/app
      - review_agent_data:/var/lib/review-agent
      - pip_cache:/root/.cache/pip
    environment:
      <<: *app-env
    env_file:
      - path: .env
        required: false
    command: ["bash", "scripts/compose-beat.sh"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  review_agent_pg:
  review_agent_data:
  pip_cache:
